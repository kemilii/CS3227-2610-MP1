plugins {
    id 'java'
    id 'checkstyle'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '11.0.0'
}

dependencies {
    String javaFxVersion = '17.0.7'
    String jUnitVersion = '5.14.4'

    implementation("org.openjfx:javafx-base:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:linux")

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform {
        excludeTags 'gui'
    }
    enableAssertions = true

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

tasks.register('guiSmokeTest', Test) {
    description = 'Runs the JavaFX end-to-end smoke test on a desktop environment.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'gui'
    }
    enableAssertions = true
}

application {
    mainClass = 'homehub.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'homehub.jar'
}

tasks.register('verifyReleaseJar') {
    description = 'Verifies that the checked-in release JAR matches the latest fat JAR.'
    group = 'verification'
    dependsOn tasks.named('shadowJar')
    doLast {
        File builtJar = tasks.named('shadowJar').get().archiveFile.get().asFile
        File releaseJar = layout.projectDirectory.file('release/homehub.jar').asFile
        if (!releaseJar.isFile()) {
            throw new GradleException('The checked-in release JAR is missing: ' + releaseJar)
        }
        java.util.zip.ZipFile builtArchive = new java.util.zip.ZipFile(builtJar)
        java.util.zip.ZipFile releaseArchive = new java.util.zip.ZipFile(releaseJar)
        try {
            Set<String> builtEntries = java.util.Collections.list(builtArchive.entries())*.name as Set
            Set<String> releaseEntries = java.util.Collections.list(releaseArchive.entries())*.name as Set
            if (builtEntries != releaseEntries) {
                throw new GradleException('release/homehub.jar does not contain the same entries as build/libs/homehub.jar')
            }
            builtEntries.each { String entryName ->
                byte[] builtBytes = builtArchive.getInputStream(builtArchive.getEntry(entryName)).withCloseable {
                    input -> input.bytes
                }
                byte[] releaseBytes = releaseArchive.getInputStream(releaseArchive.getEntry(entryName)).withCloseable {
                    input -> input.bytes
                }
                if (!java.util.Arrays.equals(builtBytes, releaseBytes)) {
                    throw new GradleException('release/homehub.jar contains stale entry: ' + entryName)
                }
            }
        } finally {
            builtArchive.close()
            releaseArchive.close()
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyReleaseJar')
}

run {
    standardInput = System.in
}
